        <form action="submission.html" method="POST" class="col-12 text-center">
            <h1 style="color: white;">Contact Us!</h1>
            <section class="formContactReasons">
                <span style="color: red;">Select your reason for contacting:</span>
                <div>
                    <input type="checkbox" id="suggestNew" name="contactReason" value="suggestNew">
                    <label for="suggestNew">Suggesting new content</label>
                    <br>
                    <input type="checkbox" name="contactReason" id="otherReason" value="otherReason">
                    <label for="otherReason">Other reasons</label>
                </div>
            </section>
            <section class="formTextArea">
                <br>
                <label for="textarea">Enter text:</label>
                <br>
                <textarea id="textarea" name="textarea" rows="6" cols="30" required></textarea>
            </section>
            <section class="formEmail">
                <br>
                <label for="formEmailText">Enter your email:</label>
                <br>
                <input type="text" name="formEmail" id="formEmailText" value="" required>
            </section>
            <section class="formSubmit">
                <br>
                <input type="submit" value="Submit"></input>
            </section>
        </form>
    </div>
